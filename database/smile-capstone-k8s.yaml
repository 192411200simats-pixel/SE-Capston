# 1. Persistent Storage for Database and MinIO
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 5Gi}
---
# 2. Postgres Database
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smile-db
spec:
  selector:
    matchLabels: {app: smile-db}
  template:
    metadata:
      labels: {app: smile-db}
    spec:
      containers:
      - name: postgres
        image: postgres:15
        env:
        - name: POSTGRES_USER
          value: "admin"
        - name: POSTGRES_PASSWORD
          value: "password123"
        - name: POSTGRES_DB
          value: "smile_db"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: db-storage
        persistentVolumeClaim: {claimName: postgres-pvc}
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector: {app: smile-db}
  ports:
  - port: 5432
---
# 3. Backend API & Dashboard
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smile-backend
spec:
  selector:
    matchLabels: {app: smile-backend}
  template:
    metadata:
      labels: {app: smile-backend}
    spec:
      containers:
      - name: backend
        image: node:18
        # Note: In a real K8s, we'd build a custom image. 
        # For this local demo, we use the base node image and a command.
        command: ["sh", "-c", "git clone https://github.com/Abhishekbodapati551/smile-capstone.git /app && cd /app/backend && npm install && node server.js"]
        ports:
        - containerPort: 5000
        env:
        - name: DATABASE_URL
          value: "postgres://admin:password123@db:5432/smile_db"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: NodePort
  selector: {app: smile-backend}
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30005
---
# 4. MinIO Storage
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  selector:
    matchLabels: {app: minio}
  template:
    metadata:
      labels: {app: minio}
    spec:
      containers:
      - name: minio
        image: minio/minio
        args: ["server", "/data", "--console-address", ":9001"]
        env:
        - name: MINIO_ROOT_USER
          value: "admin"
        - name: MINIO_ROOT_PASSWORD
          value: "password123"
        ports:
        - containerPort: 9000
        - containerPort: 9001
        volumeMounts:
        - name: storage
          mountPath: /data
      volumes:
      - name: storage
        persistentVolumeClaim: {claimName: minio-pvc}
---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
spec:
  type: NodePort
  selector: {app: minio}
  ports:
  - name: api
    port: 9000
    targetPort: 9000
    nodePort: 30000
  - name: console
    port: 9001
    targetPort: 9001
    nodePort: 30001
